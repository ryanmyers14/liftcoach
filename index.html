<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b1b19">
  <title>LiftCoach</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Applies a saved light/dark choice before the page paints (see src/theme.js).
    try {
      var savedTheme = localStorage.getItem("liftcoach_theme_v1");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {
      // Without saved settings the page follows the device theme.
    }
  </script>
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <button id="theme-toggle" type="button" class="theme-toggle">Dark mode</button>
      <h1>Lift<span>Coach</span></h1>
      <p>Log your sets. Know what to lift next.</p>
    </header>

    <p id="storage-error" class="banner banner-error" role="alert" hidden></p>

    <section id="quiz" class="card" hidden></section>

    <div id="tracker" hidden>
    <p class="calendar-row"><button id="open-calendar" type="button" class="btn-secondary">Calendar</button></p>

    <section id="rest-timer" class="card rest-timer" aria-live="off" hidden></section>

    <section id="workout" class="card" hidden></section>

    <section id="max-day" class="card max-day" hidden></section>

    <details id="week"class="card tutorial" hidden></details>

    <section id="goals" class="card" hidden></section>

    <section class="card">
      <label class="field-label" for="exercise">Exercise</label>
      <input id="exercise" class="text-input" list="common-exercises" autocomplete="off"
             placeholder="Type or pick, e.g. Bench press" maxlength="60">
      <datalist id="common-exercises">
        <option value="Back squat"></option>
        <option value="Bench press"></option>
        <option value="Deadlift"></option>
        <option value="Overhead press"></option>
        <option value="Barbell row"></option>
        <option value="Lat pulldown"></option>
        <option value="Romanian deadlift"></option>
        <option value="Leg press"></option>
        <option value="Dumbbell curl"></option>
      </datalist>
    </section>

    <section id="coach" class="card coach" aria-live="polite"></section>

    <section id="warmup" class="card" hidden></section>

    <details id="tutorial" class="card tutorial" hidden></details>

    <form id="set-form" class="card" novalidate>
      <h2>Log a set</h2>
      <div class="inputs">
        <div>
          <label class="field-label" for="weight">Weight (lb)</label>
          <input id="weight" class="text-input" type="text" inputmode="decimal" autocomplete="off" placeholder="135">
        </div>
        <div>
          <label class="field-label" for="reps">Reps</label>
          <input id="reps" class="text-input" type="text" inputmode="numeric" autocomplete="off" placeholder="8">
        </div>
      </div>
      <p id="form-message" class="form-message" aria-live="polite"></p>
      <button type="submit" class="btn-primary">Log set</button>
    </form>

    <section id="today" class="card">
      <h2>Today's sets</h2>
      <ol id="today-sets" class="set-list"></ol>
    </section>

    <p class="setup-footer"><button id="open-setup" type="button" class="btn-link"></button></p>
    <p class="setup-footer">
      <button id="export-data" type="button" class="btn-link">Export data</button>
      <button id="import-data" type="button" class="btn-link">Import data</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </p>
    <div id="import-confirm" class="card import-confirm" hidden>
      <p id="import-confirm-text"></p>
      <div class="import-confirm-buttons">
        <button id="import-confirm-yes" type="button" class="btn-primary">Replace my data</button>
        <button id="import-confirm-no" type="button" class="btn-secondary">Cancel</button>
      </div>
    </div>
    <p id="backup-message" class="form-message setup-footer" aria-live="polite"></p>
    </div>
  </main>

  <dialog id="calendar" class="calendar-dialog" aria-labelledby="calendar-title">
    <div class="calendar-head">
      <button id="calendar-prev" type="button" class="btn-secondary calendar-step" aria-label="Previous month">&lsaquo;</button>
      <h2 id="calendar-title"></h2>
      <button id="calendar-next" type="button" class="btn-secondary calendar-step" aria-label="Next month">&rsaquo;</button>
    </div>
    <div id="calendar-grid" class="calendar-grid"></div>
    <ul class="calendar-legend">
      <li><span class="calendar-key calendar-trained"></span>Trained</li>
      <li><span class="calendar-key calendar-skipped"></span>Skipped</li>
      <li><span class="calendar-key calendar-recovery"></span>Recovery</li>
      <li><span class="calendar-key calendar-planned"></span>Planned</li>
    </ul>
    <div id="calendar-detail" class="calendar-detail" aria-live="polite"></div>
    <div class="calendar-actions">
      <button id="calendar-today" type="button" class="btn-secondary">Today</button>
      <button id="calendar-close" type="button" class="btn-secondary">Close</button>
    </div>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
